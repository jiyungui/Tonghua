<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>祁祁phone</title>

  <!-- iOS PWA 沉浸式全屏配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="祁祁phone">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F1F2F1">

  <!-- 桌面图标配置 (PWA / iOS / Android) -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- 样式模块化引入 -->
  <link rel="stylesheet" href="./css/core.css">
  <link rel="stylesheet" href="./css/splash.css">
  <link rel="stylesheet" href="./css/modal.css">
  <link rel="stylesheet" href="./css/widget-p1.css">
  <link rel="stylesheet" href="./css/widget-p2.css">
  <link rel="stylesheet" href="./css/widget-p3.css">
  <link rel="stylesheet" href="./css/widget-p4.css">
</head>
<body>
  <div id="phone-screen">
    <!-- 顶部状态栏 -->
    <header class="status-bar">
      <div class="status-left">
        <span class="status-time" id="status-time-display">22:39</span>
      </div>
      <div class="status-right">
        <!-- 信号图标 -->
        <span class="status-icon">
          <svg width="15" height="11" viewBox="0 0 17 12" fill="#1D1D1F">
            <rect x="0" y="9" width="2.5" height="3" rx="0.5"/>
            <rect x="4.5" y="6.5" width="2.5" height="5.5" rx="0.5"/>
            <rect x="9" y="3.5" width="2.5" height="8.5" rx="0.5"/>
            <rect x="13.5" y="0.5" width="2.5" height="11.5" rx="0.5"/>
          </svg>
        </span>
        <!-- WiFi 图标 -->
        <span class="status-icon">
          <svg width="14" height="11" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
        </span>
        <!-- 电池图标 -->
        <span class="status-icon">
          <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="#1D1D1F" stroke-width="1.8">
            <rect x="1" y="1" width="19" height="10" rx="3"/>
            <path d="M21 4.5v3" stroke-linecap="round"/>
            <rect x="3" y="3" width="12" height="6" fill="#1D1D1F" rx="1.5"/>
          </svg>
        </span>
      </div>
    </header>

    <!-- 双页滑动主视口 -->
    <main class="screen-pages-wrapper">
      <div class="screen-pages-track" id="pages-track">
        
        <!-- ==================== 第一页 ==================== -->
        <section class="page-view" id="page-1">
          <!-- 顶部小组件 P1 -->
          <div id="slot-widget-p1"></div>

          <!-- 双列小组件区: P2 (左) 与 P3 (右) -->
          <div class="widgets-grid-2col">
            <div id="slot-widget-p2"></div>
            <div id="slot-widget-p3"></div>
          </div>

          <!-- 8个常用应用: chat-记忆世界-相册-日记-世界书-老福特-闲鱼-美团 -->
          <div class="apps-grid-4col" id="slot-apps-page1"></div>
        </section>

        <!-- ==================== 第二页 ==================== -->
        <section class="page-view" id="page-2">
          <!-- 第二页顶部小组件 (Story Mode 卡片 + 语录胶囊) -->
          <div id="slot-widget-p4"></div>

          <!-- 第二页左右分栏: 左侧放置 P2 小组件，右侧 2 列纵向放置 4 个应用 (视频, 恋人之家, 你懂得, 查手机) -->
          <div class="page2-split-grid">
            <div id="slot-widget-p2-page2"></div>
            <div class="page2-apps-2col" id="slot-apps-page2"></div>
          </div>
        </section>

      </div>
    </main>

    <!-- 底部双页指示器 -->
    <nav class="page-indicators" aria-label="页面指示器">
      <div class="indicator-dot active" data-index="0"></div>
      <div class="indicator-dot" data-index="1"></div>
    </nav>

    <!-- 底部 Dock 栏 (设置-美化-短信-频道) -->
    <footer class="dock-container">
      <div class="dock-blur-box" id="slot-dock-apps"></div>
    </footer>
  </div>

  <!-- 主逻辑模块 -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
