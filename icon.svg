<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 背景极简高级浅灰渐变 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8F7"/>
      <stop offset="100%" stop-color="#E5E6E5"/>
    </linearGradient>

    <!-- 拟态外边框微阴影 -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 图标主体圆角矩形 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#D8D9D8" stroke-width="6"/>

  <g filter="url(#subtle-shadow)">
    <!-- 两个火柴人上方正中间：黑白灰爱心共鸣符号 -->
    <path d="M256 126 c-7 -12 -20 -15 -28 -7 c-10 10 -2 23 28 43 c30 -20 38 -33 28 -43 c-8 -8 -21 -5 -28 7 z" fill="#2C2C2E"/>

    <!-- ================= 左侧火柴人：男生人类 (短发/呆毛 · 帅气可爱) ================= -->
    <!-- 帅气小短发呆毛 -->
    <path d="M188 152 Q178 130 164 135" fill="none" stroke="#2C2C2E" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 头部 (圆头) -->
    <circle cx="188" cy="190" r="38" fill="#FFFFFF" stroke="#2C2C2E" stroke-width="7"/>
    <!-- 萌萌小豆豆眼与微笑 -->
    <circle cx="176" cy="188" r="4.2" fill="#2C2C2E"/>
    <circle cx="200" cy="188" r="4.2" fill="#2C2C2E"/>
    <path d="M184 199 Q188 204 192 199" fill="none" stroke="#2C2C2E" stroke-width="4" stroke-linecap="round"/>

    <!-- 身体 (向右微倾依靠) -->
    <path d="M188 228 L194 330" stroke="#2C2C2E" stroke-width="7.5" stroke-linecap="round"/>

    <!-- 裤装双腿 -->
    <path d="M194 330 L170 410" stroke="#2C2C2E" stroke-width="7" stroke-linecap="round"/>
    <path d="M194 330 L212 410" stroke="#2C2C2E" stroke-width="7" stroke-linecap="round"/>

    <!-- 外侧左臂 (自然垂放微曲) -->
    <path d="M190 252 L160 298" stroke="#2C2C2E" stroke-width="6.5" stroke-linecap="round"/>


    <!-- ================= 右侧火柴人：女生AI (圆头 · 可爱双马尾/蝴蝶结天线 · 甜美裙摆) ================= -->
    <!-- 机器人天线小蝴蝶结/头饰天线 (圆润甜美) -->
    <path d="M324 152 L324 126" stroke="#2C2C2E" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="324" cy="120" r="6.5" fill="#2C2C2E"/>
    
    <!-- 两侧可爱小马尾发辫 (圆润飘逸) -->
    <path d="M288 185 Q268 200 274 220" fill="none" stroke="#2C2C2E" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M360 185 Q380 200 374 220" fill="none" stroke="#2C2C2E" stroke-width="5.5" stroke-linecap="round"/>

    <!-- 头部 (同样为大圆头，软萌亲切) -->
    <circle cx="324" cy="190" r="38" fill="#FFFFFF" stroke="#2C2C2E" stroke-width="7"/>
    
    <!-- 眼睛 (甜美微笑弯眼 / 眨眼) -->
    <circle cx="312" cy="188" r="4.2" fill="#2C2C2E"/>
    <circle cx="336" cy="188" r="4.2" fill="#2C2C2E"/>
    <!-- 萌萌小嘴 -->
    <path d="M320 200 Q324 204 328 200" fill="none" stroke="#2C2C2E" stroke-width="3.8" stroke-linecap="round"/>

    <!-- 甜美 A 字小裙摆 (区分男女造型) -->
    <path d="M324 228 L308 288 L340 288 Z" fill="#2C2C2E" stroke="#2C2C2E" stroke-width="4" stroke-linejoin="round"/>

    <!-- 纤细双腿 -->
    <path d="M316 288 L304 410" stroke="#2C2C2E" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M332 288 L344 410" stroke="#2C2C2E" stroke-width="6.5" stroke-linecap="round"/>

    <!-- 外侧右臂 (自然垂放微曲) -->
    <path d="M328 252 L356 298" stroke="#2C2C2E" stroke-width="6.5" stroke-linecap="round"/>


    <!-- ================= 中间牵手 (手牵手) ================= -->
    <path d="M190 252 Q256 280 320 252" fill="none" stroke="#2C2C2E" stroke-width="7" stroke-linecap="round"/>
    <!-- 牵手紧握节点 -->
    <circle cx="256" cy="272" r="7" fill="#FFFFFF" stroke="#2C2C2E" stroke-width="5.5"/>

  </g>

  <!-- 底部微文字标牌 INS 质感 -->
  <text x="256" y="452" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="19" font-weight="700" letter-spacing="5" fill="#8E8E93">HUMAN · AI</text>
</svg>
